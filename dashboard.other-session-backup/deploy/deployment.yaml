apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-automation-dashboard
  namespace: default
  labels:
    app: k8s-automation-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-automation-dashboard
  template:
    metadata:
      labels:
        app: k8s-automation-dashboard
    spec:
      serviceAccountName: k8s-automation-dashboard
      containers:
      - name: dashboard
        image: k8s-automation-dashboard:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-automation-dashboard
  namespace: default
  labels:
    app: k8s-automation-dashboard
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: k8s-automation-dashboard
